name: Self Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run mypy --strict tools
      - run: uv run yamllint .github
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --ignore-missing --check actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - run: '"$RUNNER_TEMP/actionlint/actionlint"'
