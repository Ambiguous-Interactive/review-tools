name: OpenAI Review
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: ''
      effort:
        type: string
        default: ''
      max-findings:
        type: number
        default: 5
      max-diff-chars:
        description: Maximum diff characters per model request
        type: number
        default: 180000
      max-chunks:
        description: Maximum model requests per review attempt
        type: number
        default: 8
      timeout-minutes:
        type: number
        default: 15
      disclosure:
        type: string
        default: 'DISCLOSURE: LLM-GENERATED TEXT'
    secrets:
      OPENAI_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  review:
    if: >-
      ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Review
        id: review
        # Advisory review failures must not turn into a merge gate.
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_REVIEW_MODEL: ${{ inputs.model }}
          OPENAI_REVIEW_EFFORT: ${{ inputs.effort }}
          MAX_FINDINGS: ${{ inputs.max-findings }}
          MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
          MAX_CHUNKS: ${{ inputs.max-chunks }}
          REVIEW_DISCLOSURE: ${{ inputs.disclosure }}
          REVIEW_TOOLS_SHA: ${{ job.workflow_sha }}
        run: >-
          python tools/openai_review.py --pr "$PR_NUMBER" --max-findings "$MAX_FINDINGS"
          --max-diff-chars "$MAX_DIFF_CHARS" --max-chunks "$MAX_CHUNKS"
          --output review-result.json
      - name: Preserve review results
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: openai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Outcome
        if: always()
        env:
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          echo "Advisory review execution status $OUTCOME. See the review for coverage and omitted changes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo "::warning::Review incomplete. This advisory failure does not block merging and is not a clean review."
          fi
